name: smoke
# The live site in a real browser with the QoreX test double injected: every page, the in-browser signature
# re-check on a settled job, and a fresh account funding attempt that the wallet refuses. Nothing is signed or spent.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @strongchar/web exec playwright install --with-deps chromium
      - run: pnpm --filter @strongchar/web smoke
        env:
          SMOKE_URL: https://strongchar.vercel.app
