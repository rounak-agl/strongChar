# strongchar-verifier: the verifier service.
[project]
name = "strongchar-verifier"
version = "0.1.0"
description = "strongChar verifier service"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["strongchar-runtime"]

[project.scripts]
strongchar-verifier = "strongchar_verifier.main:main"

[tool.uv.sources]
strongchar-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strongchar_verifier"]
