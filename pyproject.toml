# uv workspace root for strongChar's Python packages, apps and services.
[project]
name = "strongchar-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["strongchar-coordinator", "strongchar-core", "strongchar-datasets", "strongchar-qore", "strongchar-workloads"]

[tool.uv.workspace]
members = ["packages/core", "packages/datasets", "packages/qore", "packages/workloads", "services/coordinator"]

[tool.uv.sources]
strongchar-coordinator = { workspace = true }
strongchar-core = { workspace = true }
strongchar-datasets = { workspace = true }
strongchar-qore = { workspace = true }
strongchar-workloads = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
markers = ["live: talks to qorechain-diana; skipped in CI"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
