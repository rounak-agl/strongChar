# strongchar-datasets: canonical datasets, splits, shard files and the demo presets.
[project]
name = "strongchar-datasets"
version = "0.1.0"
description = "strongChar datasets: canonicaliser, splits, shard files, MNIST and synthetic health presets"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy>=2,<3", "strongchar-core"]

[tool.uv.sources]
strongchar-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strongchar_datasets"]
