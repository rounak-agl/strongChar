# strongchar-runtime: what nodes, verifiers and the data owner share: job specs, the coordinator client, sealing helpers.
[project]
name = "strongchar-runtime"
version = "0.1.0"
description = "strongChar runtime: job spec, coordinator client, recipient lookup, train and replay steps"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["httpx>=0.27", "strongchar-core", "strongchar-datasets", "strongchar-qore", "strongchar-workloads"]

[tool.uv.sources]
strongchar-core = { workspace = true }
strongchar-datasets = { workspace = true }
strongchar-qore = { workspace = true }
strongchar-workloads = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strongchar_runtime"]
