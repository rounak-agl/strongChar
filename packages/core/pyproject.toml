# strongchar-core: deterministic encodings, weight blobs, merge and gate, judging and settlement shared by every service.
[project]
name = "strongchar-core"
version = "0.1.0"
description = "strongChar core: encodings, weight blobs, merge and gate, exact replay judge, payout, evidence, settlement"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy>=2,<3", "eth-abi>=5,<6", "eth-hash[pycryptodome]>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strongchar_core"]
