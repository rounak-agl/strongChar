# strongchar-qore: one wrapper over the official QoreChain Python SDKs.
[project]
name = "strongchar-qore"
version = "0.1.0"
description = "strongChar's wrapper over qorechain-sdk, qorechain-qoreseal, qorechain-qoresign and qorechain-pqc"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "qorechain-sdk==0.14.0",
  "qorechain-qoreseal==0.1.0",
  "qorechain-qoresign==0.2.0",
  "qorechain-pqc==0.2.3",
  "web3>=7,<9",
  "strongchar-core",
]

[tool.uv.sources]
strongchar-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strongchar_qore"]
